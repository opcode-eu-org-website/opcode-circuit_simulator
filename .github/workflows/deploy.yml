name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: |
          cd circuitjs
          ./gradlew compileGwt --console verbose
          ./gradlew makeSite --console verbose

      - name: Fix site
        run: |
          cd circuitjs
          
          # remove duplicated docs
          (cd site && rm -f customtransformer.html customlogic.html customfunction.html subcircuits.html opampreal.html)
          # remove some not essential files
          (cd site && rm -rf WEB-INF blink-test.html jsinterface.html)
          
          # move some info html into doc/
          (cd site && mv crystal.html diodecalc.html mosfet-beta.html  doc/)
          sed -e 's@<a href="subcircuits.html">Subcircuits</a>@ \
            <a href="subcircuits.html">Subcircuits</a> \
            <hr> \
            <a href="mosfet-beta.html">MOSFET Beta</a> \
            <a href="diodecalc.html">Diode/LED Model Calculator</a> \
            <a href="crystal.html">Crystals</a> \
          @' -i site/doc/toc.html
          
          # fix applet url in doc/toc
          sed -e 's@<a target="_top" href="../index.html">@<a target="_top" href="../circuitjs.html">@' -i site/doc/toc.html
          
          cp -f ../resources/iframe.html site/iframe.html

      - name: Generate "tag" redirects
        run: |
          wget -O - https://raw.githubusercontent.com/opcode-eu-org-website/opcode-main/refs/heads/master/booklets/extra-tex-files/booklets-sections/electronics/simulations.txt | \
            while read tag url; do ./resources/create_redirect.sh "../circuitjs.html?$url" "circuitjs/site/$tag"; done
          (cd circuitjs/site; rm -f index.html; ln -s circuitjs.html index.html)
          
      - name: Build offline archive
        run: |
          (cd ./circuitjs/site; rm -f offline.tar.xz; tar -chJf ../offline.tar.xz .; mv ../offline.tar.xz .);

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./circuitjs/site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
